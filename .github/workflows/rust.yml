name: Rust Linux
on: [push, pull_request]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize project guidance
        run: python3 tools/sync_guidance.py --check
      - name: Provision pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Provision pinned free-threaded CPython
        run: python3 tools/bootstrap.py
      - name: Build Rust library and Python extension
        run: python3 tools/build.py
      - name: Run applicable original batch tests
        run: python3 tools/run_original_tests.py tests/python/bluetests/test/test_memstream.py tests/python/bluetests/test/test_events.py
  sync-guidance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/blue-rs-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update guidance mirrors automatically
        run: python3 tools/sync_guidance.py --commit
      - name: Publish guidance updates to development branch
        run: git push origin HEAD:blue-rs-dev
