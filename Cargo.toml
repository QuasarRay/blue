[package]
name = "blue"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license-file = "LICENSE.md"
description = "Carbon Blue and BlueExposure, implemented in Rust on Bevy"

[workspace]
resolver = "3"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["python-extension"]
python-extension = ["pyo3/extension-module"]

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["std", "async_executor", "multi_threaded"] }
pyo3 = { version = "=0.30.1" }
async-channel = "=2.5.0"
